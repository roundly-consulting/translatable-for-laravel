name: run-tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.4]
        laravel: [12.*, 13.*]
        stability: [prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    # No postgres service here any more. This job used to run one, with a job-level
    # TRANSLATABLE_PGSQL_* convention local to this package, so that a handful of
    # pgsql-gated cases could run inside the sqlite job. That work now belongs to the
    # test-pgsql leg below, on the fleet-standard TESTING_DB_* vars — the postgres-gated
    # cases skip here, visibly, and run there.
    #
    # Keeping the sqlite job is not a formality: bug #39 (a LIKE with no ESCAPE clause) is
    # GREEN on postgres and matches nothing on sqlite. Re-measured on this row by
    # re-introducing it verbatim — sqlite 4 failed, postgres 6 passed. Sqlite is the leg
    # that catches this package's own famous bug.

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, fileinfo, openssl
          coverage: pcov

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --coverage --min=90

  test-pgsql:
    runs-on: ubuntu-latest
    name: P8.4 - pgsql real-engine

    steps:
      # Started first so the engine boots while PHP and the dependencies install. The data
      # directory is tmpfs and durability is off: the same planner, isolation levels, locks and
      # limits — nothing this leg proves depends on surviving a power cut.
      - name: Start postgres
        run: >-
          docker run -d --name postgres --tmpfs /var/lib/postgresql/data
          -e POSTGRES_DB=testing -e POSTGRES_USER=testing -e POSTGRES_PASSWORD=secret
          -p 5432:5432 postgres:16
          -c fsync=off -c synchronous_commit=off -c full_page_writes=off

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pgsql, pdo_pgsql, bcmath, soap, intl, fileinfo, openssl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # The image's init server listens on the socket only, so a TCP answer means the real one is up.
      - name: Wait for postgres
        run: |
          for _ in $(seq 1 90); do
            docker exec postgres psql -h 127.0.0.1 -U testing -d testing -c 'select 1' >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs postgres
          exit 1

      - name: Execute tests against postgres
        env:
          # TESTING_DB_DRIVER is what moves the suite off sqlite. The location vars alone
          # only say where the engine is; without the driver this job would run every test on
          # sqlite and call itself a postgres leg. It also replaces this package's old
          # TRANSLATABLE_PGSQL_* convention, which asked whether the vars were SET rather
          # than whether an engine could be REACHED.
          #
          # This is the leg that owns the postgres-only surface: the `ilike` branch and real
          # `jsonb` columns (plus sluggable's per-locale slugs over them, via the integration
          # suite).
          TESTING_DB_DRIVER: pgsql
          TESTING_DB_HOST: 127.0.0.1
          TESTING_DB_PORT: 5432
          TESTING_DB_DATABASE: testing
          TESTING_DB_USERNAME: testing
          TESTING_DB_PASSWORD: secret
        # Coverage is enforced on the sqlite matrix; this is a correctness leg.
        run: vendor/bin/pest --ci

  test-mysql:
    runs-on: ubuntu-latest
    name: P8.4 - mysql real-engine

    # The third engine, and the one this package cannot do without. Translatable branches on
    # `ConnectionDriver::isPgsql()`, so everything that is not postgres takes the `like`
    # branch — and until this leg existed, "not postgres" was only ever proven against
    # sqlite. MySQL and sqlite share that branch but disagree about it: sqlite has NO default
    # LIKE escape character, MySQL has one. So the branch was only ever tested on the more
    # forgiving of the two engines that use it, and the `jsonb()` macro's non-postgres
    # mapping was likewise only ever seen by sqlite.
    steps:
      # Started first, tmpfs datadir, binlog off and no flush per commit — the same InnoDB,
      # isolation levels, locking and limits. performance_schema stays at its default.
      - name: Start mysql
        run: >-
          docker run -d --name mysql --tmpfs /var/lib/mysql
          -e MYSQL_DATABASE=testing -e MYSQL_USER=testing -e MYSQL_PASSWORD=secret -e MYSQL_ROOT_PASSWORD=secret
          -p 3306:3306 mysql:8
          --skip-log-bin --sync-binlog=0 --innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=OFF

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, pdo_mysql, bcmath, soap, intl, fileinfo, openssl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # The image's init server runs with networking off, so a TCP answer means the real one is up.
      - name: Wait for mysql
        run: |
          for _ in $(seq 1 90); do
            docker exec mysql mysql -h 127.0.0.1 -uroot -psecret -e 'select 1' testing >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs mysql
          exit 1

      - name: Execute tests against mysql
        env:
          TESTING_DB_DRIVER: mysql
          TESTING_DB_HOST: 127.0.0.1
          TESTING_DB_PORT: 3306
          TESTING_DB_DATABASE: testing
          TESTING_DB_USERNAME: testing
          TESTING_DB_PASSWORD: secret
        run: vendor/bin/pest --ci
